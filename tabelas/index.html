<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse:collapse;
            width: 500px;

        }
        
         th,td{

            width: 200px;
            border: 1px solid black;
            padding: 5px;
    

         }
         thead>tr, .cinza{
            background-color: rgb(61, 58, 58);
            color: white;
            
         }
         .med{
            text-align: center;
         }


    </style>
</head>
<body>
    <table>
      <colgroup>
            <col class="area">
            <col class="dis">
            <col class="notas">
            <col class="med">
        
        </colgroup>
        <thead>
            <tr>
                <th rowspan="5" scope="col">Área</th>
                <th rowspan="5" scope="col">disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="5" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">exatas</th>
                <td>matematica</td>
                <td >0.0</td>
                <td ">0.0</td>
                <td >0.0</td>
            </tr>
           
            <tr>
                <td>fisica</td>
                <td >0.0</td>
                <td >0.0</td>
                <td >0.0</td>
            </tr>
            <tr>
                <td>biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr class="cinza">
                <th colspan="4" scope="row" >media de exatas </th>
                <td>0.0</td>
            </tr>

            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>

            </tr>

        </tbody>

        <tfoot>
            <tr class="cinza">
                <th colspan="4" scope="row" >Media de humanas</th>
                <td> 0.0</td>
            </tr>
        </tfoot>

    </table>
</body>
</html>
